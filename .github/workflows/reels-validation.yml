name: Validate Nexora Reels
on:
  push:
    branches:
      - feat/nexora-reels-editor-final
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Production build (includes Next.js TypeScript validation)
        run: npm run build
