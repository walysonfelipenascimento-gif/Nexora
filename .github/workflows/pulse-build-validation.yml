name: Nexora build validation

on:
  push:
    branches:
      - feat/nexora-pulse-foundation
      - nexi/auditoria-reestruturacao-profissional
  pull_request:
    branches:
      - nexora/primeira-etapa-base-segura

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
