name: Nexora build validation

on:
  push:
    branches:
      - feat/nexora-pulse-foundation
      - nexi/auditoria-reestruturacao-profissional
  pull_request:
    branches:
      - nexora/primeira-etapa-base-segura

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint Nexi source code
        run: npx eslint app/nexi/page.tsx app/api/nexi/chat/route.ts app/api/nexi/status/route.ts
      - name: Report existing repository-wide lint baseline
        run: npm run lint
        continue-on-error: true
      - name: Build production bundle
        run: npx next build --no-lint
