<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="nexora-face" x1="128" y1="112" x2="397" y2="398" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28F3E4"/>
      <stop offset=".24" stop-color="#19D6E7"/>
      <stop offset=".48" stop-color="#218FEF"/>
      <stop offset=".7" stop-color="#5369FF"/>
      <stop offset=".86" stop-color="#8B4DFF"/>
      <stop offset="1" stop-color="#D34BFA"/>
    </linearGradient>
    <linearGradient id="nexora-depth" x1="160" y1="140" x2="405" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087A9C"/>
      <stop offset=".42" stop-color="#174CBA"/>
      <stop offset=".72" stop-color="#3C31B5"/>
      <stop offset="1" stop-color="#70239E"/>
